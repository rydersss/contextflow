[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
version = "0.2.0"
description = "Intelligent context management for AI coding agents — reduce token usage by 55-70%"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "contextflow"}]
keywords = ["ai", "llm", "context", "token", "compression", "claude-code", "cursor", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/contextflow/contextflow"
Repository = "https://github.com/contextflow/contextflow.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
